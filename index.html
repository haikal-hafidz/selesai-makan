<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#d97706" />
    <meta name="description" content="Selesai Makan — Personal Learning Hub for structured offline-first education, Excel mastery, copywriting, and practice tracks." />
    <meta name="application-name" content="Selesai Makan" />
    <meta name="apple-mobile-web-app-title" content="Selesai Makan" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Selesai Makan</title>
    <style>
      /* Standalone HTML-level initial shell loading indicator before JS bundle evaluates */
      #app-pre-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fafaf9;
        color: #1c1917;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .pre-loader-brand {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background-color: #d97706;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 15px -3px rgba(217, 119, 6, 0.2);
        margin-bottom: 24px;
      }
      .pre-loader-bar {
        width: 192px;
        height: 4px;
        background-color: #e7e5e4;
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 24px;
        margin-bottom: 12px;
      }
      .pre-loader-progress {
        height: 100%;
        width: 40%;
        background-color: #d97706;
        border-radius: 9999px;
        animation: preLoaderAnim 1.4s infinite linear;
      }
      @keyframes preLoaderAnim {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-200">
    <!-- Immediate HTML shell loading screen (removed as soon as React hydrates DB) -->
    <div id="app-pre-loader" role="status" aria-live="polite">
      <div class="pre-loader-brand">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div style="font-size: 1.25rem; font-weight: 700; color: #1c1917; letter-spacing: -0.025em;">Selesai Makan</div>
      <div style="font-size: 0.75rem; font-weight: 500; color: #78716c; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px;">Personal Learning Hub</div>
      <div class="pre-loader-bar">
        <div class="pre-loader-progress"></div>
      </div>
      <div style="font-size: 0.75rem; font-weight: 500; color: #57534e;">Initializing personal learning hub...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
