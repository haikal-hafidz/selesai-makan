<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selesai Makan — Offline</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f4;
        color: #1c1917;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        max-width: 420px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        border: 1px solid #e7e5e4;
      }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #d97706; }
      p { font-size: 0.875rem; color: #57534e; line-height: 1.5; }
      button {
        background: #d97706;
        color: white;
        border: none;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Selesai Makan is Offline</h1>
      <p>Your local learning materials, notes, and quiz history are stored safely on this device. Reconnect or reload to return to the application.</p>
      <button onclick="window.location.reload()">Reload App</button>
    </div>
  </body>
</html>
